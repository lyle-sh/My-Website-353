[build]
  publish = "."

# Legacy redirects: pages used to live under HTML/ and were served at /html/<page>.
# Matching is case-sensitive, so the on-disk /HTML/ casing needs its own rules
# alongside the lowercase form Pretty URLs produced. Order matters — Netlify takes
# the first match, so the homepage rules come before the catch-all splats, which
# would otherwise point at a now-nonexistent /HomePage.html.
[[redirects]]
  from = "/html/homepage"
  to = "/"
  status = 301

[[redirects]]
  from = "/html/homepage.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/HTML/HomePage.html"
  to = "/"
  status = 301

[[redirects]]
  from = "/html/*"
  to = "/:splat"
  status = 301

[[redirects]]
  from = "/HTML/*"
  to = "/:splat"
  status = 301
